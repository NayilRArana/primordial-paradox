# PP-04 "Navy Sailors" v2: the first fight cue, rebuilt on the hook meter. Card AUTO-MUSIC-NEXT
# (t_406c2001), musician lane, 2026-10-23. Everything here is original: no melody, riff or bass
# line of any published game is quoted, and the technique is the same Capcom study the v1 score
# cites (knowledge/MUSIC-STYLE-BIBLE.md, knowledge/music-styles/capcom.md, knowledge/MUSIC-DRUMS.md).
#
# What v2 changes and why, in one place:
#   - motif N is reshaped from a neighbour turn into a step ladder that leaps to its peak and walks
#     back down. v1 measured contour 0 of 5 returns arch or pedal and 2 leaps per motif; the hook
#     meter wants every return to be an arch (or a pedal) and exactly one leap. The cell keeps the
#     same character: minor ladder, one big jump at the top, stepwise way home.
#   - the third statement (bars 5 and 6) ends with a passing note instead of the held Bb, so the
#     third return is a variation, not a copy (v1 measured 100 percent the same).
#   - bars 8, 23 and 24 are statements of the cell now, which is the motif coverage lever.
#   - the kit is written in rungs: a 4 bar rung changes the kick and the last eighth, an 8 bar
#     rung adds a noise tom fill and a crash into the next phrase.
# Tempo, key, time, form, loop point, chords, the release in B and the tail lift are v1's.
#
# 4/4, D minor with a Dorian Bb over the VII chord, 176 bpm, 32 bars = 43.636 s.
# Durations are in eighth notes; a 4/4 bar holds 8. Note names are concert pitch (A4 = 440 Hz).
meta:
  profile: pp04
  version: v2
  key: D minor
  time: 4/4
  bpm: 176
  bars: 32
  loop_start_bar: 1
  loop_end_bar: 28
  tail_bars: 29 to 32
  form: "A 8 (the hook) + B 8 (the release, where the dodge phase sits) + A2 8 (the hook again, third statement changed) + A3 8 (the hook once more, then the resolve in bars 29 to 32); bars 1 to 28 loop, bars 29 to 32 are the tail that plays when the fight ends"
  duration_seconds: 43.636
  fight_length: "the fight runs 45 to 60 s, so the loop plays 1.2 to 1.6 times and the tail resolves it"

motifs:
  N: "The sailor's shout, two bars, shaped as one arch. Bar 1 walks up the minor ladder A Bb C D E and leaps a fourth to A5, the peak; bar 2 walks the same ladder back down to the leading tone. One leap per motif, the rest steps, the same rhythm 1 1 1 1 2 2 in both bars, and the peak is the leap, so the shape the ear keeps is up the ladder and the jump."
  N_lift: "The tail lift, unchanged from v1: the same cell in quarters, walked up the triad A D F A and landed on the tonic D."

