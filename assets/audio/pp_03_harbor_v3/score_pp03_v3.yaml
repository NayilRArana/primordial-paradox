drums_contract:
  source: "data/drum_patterns.json, read at build time by id; nothing here is invented"
  ladder: "bar by bar rungs from knowledge/MUSIC-DRUMS.md section 4, eight bar cycle, plus the 4 and 8 bar phrase plan the builder adds"
  phrase_plan: "bar 4 of every 8 gets the one beat fill, bar 8 gets the two beat fill, odd bars between get a ghost note on the and of 4, and the rung list itself changes the home pattern bar by bar so no two bars are identical"
  level_note: "a calm cue is the same rhythm with every level at 2 or 3 (MUSIC-DRUMS 2.4), so every hit is scaled by the section's level_scale and capped at velocity 60"
