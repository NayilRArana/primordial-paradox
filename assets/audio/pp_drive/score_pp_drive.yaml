# PP-DRIVE, "The Drive": London to Southampton, the 178 second film's road cue.
# Card MUS-CUE-DRIVE (t_0c5ef0c5). Original throughout. No melody, riff or bass line of any
# published game is quoted. Technique comes from knowledge/MUSIC-STYLE-BIBLE.md (recipes cited by
# id), knowledge/CHARACTER-BIBLE.md (the four leitmotifs and their allowed transformations) and
# knowledge/MUSIC-HOOK-GRAMMAR.md (HOK ids). Those are rules, not tunes.
#
# WHAT THIS CUE HAS TO BE: the clock for a twelve shot drive (knowledge/DRIVE-SHOT-LIST.md). The
# film is cut on this cue's bar grid, so the cue is 3/4 at 126 bpm: one bar is 1.4286 s, 85.714
# steps, and the shot list's hard cuts at bars 8, 18, 25, 34, 46, 59, 97, 107, 120, 133 and 141
# are all downbeats here. 125 bars is 178.571 s; the picture's last fade lands inside bar 125 and
# the cue ends on the tonic at 178.57 s, half a second after the film's 178.00 s, which is the
# tail a cue is supposed to have and not a sync error.
#
# THREE SECTIONS, one per stretch of road, and each one loops on its own so a car scene can cut:
#   A         bars 1 to 25    the city at night, A minor, sparse. Shots 1 to 3 (23 bars) plus two
#                             bars of gantry build. Loop: A to A (25 bars, 35.7 s).
#   B         bars 26 to 59   the M25 then the M3, C major, motor eighths. Shots 4 to 6 (34 bars
#                             exactly). Loop: B to B (34 bars, 48.6 s), which is the cruising
#                             section and the one the services interlude walks over.
#   A_return  bars 60 to 125  Winchester rising, the sea theme, then the docks. Shots 7 to 12
#                             (66 bars: 10 + 10 + 13 + 13 + 8 + 12). No loop: this ends the film.
#
# THE FOUR MOTIFS, transformed, never quoted plainly in their home key and rhythm except where
# the score says "literal":
#   K   the family call, E5 C5 D5 E5 in A minor. Augmented at bars 9, 70 and 124 (first note
#       doubled), inverted at bar 13, moved to C major at bar 34 (mode swap), and at the docks it
#       is folded into the final cadence. Stated literally only at bars 5 and 74, twice in one cue
#       being the cap (HOK-15).
#   Z   the Zeus arpeggio, G4 C5 E5, its home key C major. That is why section B is C major: the
#       motorway is the one place in the film the sky is open, so it gets Z in its own key, and
#       the rising sequence at bars 42 to 48 is Z sequenced up by step.
#   P   the tide, E4 G4 B4 then E5 D5 B4, home E minor. Hinted first in section B's bass line
#       (the walking third), then stated in E minor in the cutting (bars 60 to 69) and moved to
#       A minor for the docks (bars 114 to 122): a key change, which is the allowed operation.
#   H   the bident, D5 C#5 then A4 G#4 with silence. Four entrances: bars 17 and 18 (the cold
#       city), bars 38 and 39 (the wipers), bars 94 and 95 (the storm), and 123 (the last turn).
# Durations are in eighth notes; a 3/4 bar holds 6. "X|Y" in a chord slot means X on beats 1 and 2,
# Y on beat 3. Names after notes: A4 is concert A at 440 Hz. A sharp is written A#, a flat Ab. r is
# a rest. Every melody bar sums to 6 eighths; tools/arrange.py refuses the score if one does not.
meta:
  profile: waltz
  key: A minor
  time: 3/4
  bpm: 126
  loop_start_section: A
  loop_end_section: A_return
  form: "A 25 (the city, 35.7 s) + B 34 (the M25 and the M3, 48.6 s) + A_return 66 (Winchester, the sea, the docks, 94.3 s) = 125 bars, 178.571 s at 126 bpm on the title_timing grid (bar_steps 87, steps_per_bar 85.714). Section A and section B each loop in place; A_return does not, it ends on the tonic"
  texture_family: "road piece: pulse 1 runs the wheels (Alberti eighths, six a bar, unbroken for 125 bars), the triangle takes the road surface (root on beat 1, fifth or approach on beat 3 in A and A_return; root, third, approach in B so the eighth pulse never stops), the VRC6 saw is the bodywork (oom pah stabs in A and A_return, one held shell pad in B), the lead is the driver's line and it is silent for the first two bars and again at the cathedral caption. Contrast is made by adding surfaces, not by raising levels: section A has no kick, B has hats on every beat, A_return gets the kick, the echo and the fill"

motifs:
  K:  "Family call. Bars 5, 6 (literal in A minor, the two allowed statements) and 74 (literal, the cathedral). Bar 9 and bar 124 augment it (4 1 1 instead of 3 1 1 1)."
  Ki: "K inverted at bar 13 (A4 C5 B4 A4, the third up instead of down), diatonic in A minor so it stays recognisable."
  Kc: "K in C major at bar 34 (G5 E5 F5 G5), the mode swap: same shape, the third is major now, which is the motorway's brightness."
  Z:  "Zeus arpeggio in C, bars 26, 28, 42 and 46, and sequenced up by step in bars 42 to 48."
  P:  "Tide, E minor, bars 60 to 69 (E4 G4 B4 then E5 D5 B4 twice), then the same shape in A minor at bars 114 to 122 for the lit ship at the quay."
  Ph: "The P hint early: the walking bass of section B always approaches by the tide's third, so the sea is in the motorway's bass line thirty bars before the melody says it."
  H:  "Bident, bars 17 and 18, 38 and 39, 94 and 95, 123. Always D5 C#5 then A4 G#4 with the rest after it, never filled in."

