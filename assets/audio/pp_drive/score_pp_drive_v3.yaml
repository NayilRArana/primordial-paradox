# PP-DRIVE v2, "The Drive": the same 178 second film, with the lead rebuilt as a hook
# and the drums varied every 4 and 8 bars. Built by tools/drive_v2.py from
# score_pp_drive.yaml, which is v1 and stays where it is. Card AUTO-MUSIC-NEXT.
#
# v1's lead was arpeggios: tools/hook_score.py measured 13 percent motif coverage and 46
# of 100. v2 states one 2 bar cell (8 notes, 3 1 1 1 | 2 1 1 2, six of seven intervals
# steps, one leap of a fourth, arch contour) and returns it in the key of each stretch,
# so the ear has something to hold while the wheels stay in pulse 1. The literal
# statements of K, Z, P and H are where CHARACTER-BIBLE puts them, and the lead peak
# sits inside an octave and a half.
#
# Harmony, section lengths, tempo and the shot grid are v1's, unchanged: 125 bars of 3/4
# at 126 bpm, 178.571 s on data/title_timing.json. Dissonance is DIS-02, the chromatic
# lower neighbour (the sharp five), one per eight bars in a marked bar, and the flat six
# to five that the cell's last note makes on every return (knowledge/MUSIC-DISSONANCE.md).
meta:
  profile: waltz
  key: A minor
  time: 3/4
  bpm: 126
  loop_start_section: A
  loop_end_section: A_return
  form: A 25 (the city, 35.7 s) + B 34 (the M25 and the M3, 48.6 s) + A_return 66 (Winchester, the sea, the docks, 94.3 s) = 125 bars, 178.571 s at 126 bpm on the title_timing grid (bar_steps 87, steps_per_bar 85.714). Section A and section B each loop in place; A_return does not, it ends on the tonic
  texture_family: 'road piece: pulse 1 runs the wheels (Alberti eighths, six a bar, unbroken for 125 bars), the triangle takes the road surface (root on beat 1, fifth or approach on beat 3 in A and A_return; root, third, approach in B so the eighth pulse never stops), the VRC6 saw is the bodywork (oom pah stabs in A and A_return, one held shell pad in B), the lead is the driver''s line and it is silent for the first two bars and again at the cathedral caption. Contrast is made by adding surfaces, not by raising levels: section A has no kick, B has hats on every beat, A_return gets the kick, the echo and the fill'
motifs:
  K: Family call, literal in A minor at bars 5 and 6 (the two allowed statements) and at bar 74 in the cathedral, inverted at bar 13, augmented at bars 70, 71 and 124, moved to C major at bar 34. All of them on the statements CHARACTER-BIBLE names.
  Ki: K inverted at bar 13 (A4 C5 B4 A4).
  Kc: K in C major at bar 34 (G5 E5 F5 G5), the mode swap on the motorway.
  Z: Zeus arpeggio, literal in C at bars 26 and 28; the cell's own arch takes the rising sequence's place in bars 42 to 48 so the hook does not compete with the arpeggio.
  P: Tide in E minor at bars 60, 61, 64, 65 and 98, then the same shape in A minor at bars 114 and 115 for the lit ship.
  Ph: 'The P hint early: the walking triangle of section B still approaches by the tide''s third, so the sea is in the motorway''s bass line before the melody says it.'
  H: Bident at bars 17, 18, 38, 39, 94, 95 and 123, with the rest after each prong, never filled in.
  hook_cell: 'The lead''s own cell: C5 D5 E5 G5 then A5 G5 E5 A4, eight notes over two bars, an arch, one leap and six of seven intervals steps. It returns 37 times, which is what hook_score.py measures as 63 percent coverage.'

