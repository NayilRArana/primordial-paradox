      chords:
      - Em
      - Em
      notes:
      - - - E4
          - 6
      - - - G4
          - 2
        - - B4
          - 1
        - - E5
          - 3
      rhythm_cell: 6 | 2 1 3
      why: a bar of the lowest E is the sea floor, then a three step staircase arrives at the crest; the extreme contrast between one attack and three is the identity, and the low E is the register marker
        for the sea
      cites: BAR-11; MET-10 (low register weight)
    - id: P6
