      rhythm_cell: 2 4 | 1 1 4
      why: 'the wave breaks on the weak side: peak first, then a stepwise roll down to the third and a held landing; starting high is the difference from the parent and it makes the motif read as a crash
        rather than a lift'
      cites: parent P; RCK-09 (contrast by register, not by notes)
  H:
    name: Hades, the bident
    parent: 'two descending half steps with a gap: D5 C#5, rest, A4 G#4, D minor'
    key: D minor
    scale:
    - D
    - E
    - F
    - G
    - A
    - Bb
    - C
