    tool: tools/hook_score.py
    command: python tools/hook_score.py --melody-json <candidate>.json --json <report>.json, once per candidate per mode, 64 runs
    grammar_source: 'defaults (no hook_score: yaml block in knowledge/MUSIC-HOOK-GRAMMAR.md)'
    modes:
      cell: 'the candidate exactly as written, 1 or 2 bars: the cell''s own shape'
      tiled: the same candidate repeated 4 times, so the repetition items have something to measure
    scale_note: the tool is out of 100, but motif_returns (12), third_return (8) and loop_length (6) cannot be earned by a bare 1 to 2 bar cell, so compare cell scores against 74 and do not read a cell
      score of 72 as a failure
    ranking_rule: cell score, then tiled score, then checklist total, then id; the cell score leads because the cell is what the card asked for, and the tiled score breaks ties in favour of the figure that survives a loop; one override is recorded in STUDY.md section 3.3, where H8 is the second H pick instead of H5 for its checklist score and its octave drop
