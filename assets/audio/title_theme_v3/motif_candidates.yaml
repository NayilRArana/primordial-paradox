        - - C#5
          - 2
      rhythm_cell: 4 2
      why: one prong only, slowed to a half and a quarter; the missing second prong is the point, because the listener hears the motif start and stop, which is colder than hearing it finish
      cites: parent H; MOT-08 (a motif withheld)
    - id: H8
      label: the low growl
      bars: 2
      chords:
      - A7
      - Dm
      notes:
      - - - A4
          - 2
        - - G#4
          - 1
        - - A4
          - 1
        - - G#4
          - 2
      - - - D4
          - 6
      rhythm_cell: 2 1 1 2 | 6
      why: the low prong hammers its semitone four times and then the motif falls an octave to D4; the repeated G sharp is a shudder, and the drop to the bottom of the usable range is the floor of the character
      cites: MET-10 (low register weight); BAR-07 (repeated ornament)
