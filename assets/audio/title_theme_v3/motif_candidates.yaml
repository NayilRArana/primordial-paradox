      why: the parent compressed into one bar, so both prongs are heard inside a single beat group and the silences become the pulse; the second prong answers upward, which is the one contour change that
        keeps the two stabs identical in rhythm while making the figure a question and an answer rather than two falls. A listener hears two sharp stabs and a hole, which is the bident in one gesture
      cites: parent H; MET-08 (tritone stab on the beat); CHIP-03
    - id: H2
      label: the double prong
      bars: 2
      chords:
      - Dm
      - Dm
      notes:
      - - - D5
          - 2
        - - C#5
          - 2
        - - D5
          - 2
      - - - A4
          - 2
        - - G#4
          - 2
        - - A4
          - 2
      rhythm_cell: 2 2 2 | 2 2 2
      why: each prong is a neighbour that returns, so the motif is two identical cells a fourth apart; the repetition is the machine, and the semitone is the edge of the blade
      cites: BAR-07 (mordent figure); MET-05 (flat second as the signature)
    - id: H3
      label: the cold descent
      bars: 2
      chords:
      - Dm
      - A7
      notes:
      - - - D5
          - 1
        - - C#5
          - 1
        - - B4
          - 1
        - - Bb4
          - 1
        - - A4
          - 1
        - - r
          - 1
      - - - G#4
          - 6
      rhythm_cell: 1 1 1 1 1 r | 6
      why: four semitone-related pitches in a row are the most exposed chromatic line in the score, and it lands on a held G sharp, the leading tone of the dominant; the ear remembers the shiver, not a
        tune
      cites: MET-07 (harmonic minor over V7); CLS-11 (secondary dominant)
    - id: H4
      label: the held prong
      bars: 2
      chords:
      - Dm
      - Dm
      notes:
      - - - D5
          - 6
      - - - r
          - 1
        - - C#5
          - 1
        - - A4
          - 4
      rhythm_cell: 6 | r 1 4
      why: a whole bar on the cold high D, then the drop and the second prong inside one bar; the patience before the fall is the threat, and the silence is written at the start of the second bar where
        it can be heard
      cites: BAR-11 (held voice); MET-09 (rest before the hit)
    - id: H5
      label: the rising bident
      bars: 2
      chords:
      - A7
      - Dm
      notes:
      - - - G#4
          - 1
        - - A4
          - 3
        - - r
          - 2
      - - - C#5
          - 1
        - - D5
          - 3
        - - r
          - 2
      rhythm_cell: 1 3 r | 1 3 r
      why: the same two semitone prongs turned upward, so it is the parent seen from the other side; each prong is a short note bending into a long one instead of two equal steps, so the rhythm is a lean
        forward rather than the parent's even tread, and rising to the tonic instead of falling away from it makes it usable where H would sound like an ending
      cites: parent H; MET-06 (resolve the raised seventh up to the tonic)
    - id: H6
      label: the knocking prong
      bars: 1
      chords:
