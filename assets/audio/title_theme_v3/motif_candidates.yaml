    - C#
    - G#
    register_band:
    - 48
    - 78
    parent_notes:
    - - D5
      - 2
    - - C#5
      - 2
    - - A4
      - 2
    - - G#4
      - 2
    brief: 'cold, exact, mechanical: semitones, a defined silence, two prongs, a low register and no ornament that would soften it'
    candidates:
    - id: H1
      label: the two prongs, faster
      bars: 1
      chords:
