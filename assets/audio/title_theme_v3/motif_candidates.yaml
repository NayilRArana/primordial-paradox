# Motif candidate study, card MUS-STUDY (musician lane), 2026-10-21.
# 8 candidate rewrites of each of the four title theme leitmotifs from score_v3.yaml:
#   K the Kronos call (A minor), Z Zeus sunny rising (C major),
#   P Poseidon the tide (E minor), H the Hades bident (D minor).
# This file is a study artifact: score_v3.yaml is NOT touched by this card.
# The scores block is written by scripts in the card workspace, do not edit it by hand.
# Two scorers, both re-runnable: score_motifs.py (the 20 item checklist) and
# tools/hook_score.py (the project's own scorer, run over every candidate, block scores.hook_score).
# Conventions: durations in eighth notes (6 per 3/4 bar); notes bar by bar;
# r is a rest; both scorers check rhythm_cell against the notes.
#
meta:
  card: MUS-STUDY
  parent_score: assets/audio/title_theme_v3/score_v3.yaml
  time: 3/4
  eighths_per_bar: 6
  grammar_status: knowledge/MUSIC-HOOK-GRAMMAR.md exists and was read for this reconciliation; its 20 item delivery checklist is section 9, and the interim checklist in STUDY.md section 2 is kept for the
    cell level items the delivery checklist does not cover
  scorer: score_motifs.py for the 20 item checklist, tools/hook_score.py for the project scorer, both run from the card workspace over the same note data
  rule_followed: no melody of any published game was consulted, quoted or transcribed; every candidate below is new
  hook_score_grammar_block: 'tools/hook_score.py found no fenced yaml hook_score: block in the grammar file, so its DEFAULTS applied; every report says grammar: defaults'
motifs:
  K:
    name: Kronos, the family call
    parent: 'dotted quarter then three stepwise eighths, starting on the fifth: E5 C5 D5 E5, one bar'
    key: A minor
    scale:
    - A
    - B
    - C
    - D
    - E
    - F
    - G
    chromatic_allowed:
    - G#
    register_band:
    - 60
    - 81
    parent_notes:
    - - E5
      - 3
    - - C5
      - 1
    - - D5
      - 1
    - - E5
      - 1
    brief: 'an announcement: a horn or a clock, identifiable in the first two notes, singable in one breath, at home over Am and able to lead to Dm or E7'
    candidates:
    - id: K1
      label: the long call
      bars: 2
      chords:
      - Am
      - Am
      notes:
      - - - E5
          - 4
        - - C5
          - 2
      - - - D5
          - 2
        - - E5
          - 2
        - - A4
          - 2
      rhythm_cell: 4 2 | 2 2 2
      why: 'the parent cell turned inside out: the dotted value arrives first, the answer climbs, then the line drops a fourth to the tonic; the shape is recognised before the rhythm is, and the drop is
        what tells it apart from the parent'
      cites: parent K; CLS-02 (shared motif across the period); MOT-07 (one breath)
    - id: K2
      label: the horn fifth
      bars: 1
      chords:
      - Am
      notes:
      - - - E5
          - 2
        - - A4
          - 1
        - - B4
          - 1
        - - C5
          - 2
      rhythm_cell: 2 1 1 2
      why: a dropped fifth is the oldest horn call there is, and after it the line climbs back by step, so the ear files it as one gesture with a hole in the middle; the palindrome rhythm makes it land
        the same way forwards and backwards
      cites: parent K; UEM-05 (fanfare figure); FOX-05 (one signature interval)
    - id: K3
      label: the three knocks
      bars: 1
      chords:
      - Am
      notes:
      - - - E5
          - 1
        - - r
          - 1
        - - E5
          - 1
        - - r
          - 1
        - - E5
          - 2
      rhythm_cell: 1 r 1 r 2
      why: two staccato knocks and a held one on a single pitch, which is a clock striking; identity here is rhythm and silence only, the cheapest hook on a chip and the hardest to confuse with anything
        else in the score
      cites: CHIP-03 (noise and silence as rhythm); MOT-05 (one rhythmic signature per place)
    - id: K4
      label: the descent from the octave
      bars: 2
      chords:
      - Am
      - Am
      notes:
      - - - A5
          - 2
        - - G5
          - 1
        - - F5
          - 1
        - - E5
          - 2
      - - - E5
          - 2
        - - C5
          - 2
        - - A4
          - 2
      rhythm_cell: 2 1 1 2 | 2 2 2
      why: one uninterrupted fall from the tonic an octave up to the tonic below, so the motif is a single direction and the two repeated E5s are the hinge; the gap between the octave and the root is what
        makes it sound like falling sand
      cites: parent K; BAR-03 (sequence in one direction); MOT-07 (no leap past a fourth inside the descent except the hinge)
    - id: K5
      label: the tolling fourth
      bars: 2
      chords:
      - Am
      - E7
      notes:
      - - - E5
          - 6
      - - - B4
          - 1
        - - C5
          - 1
        - - D5
          - 4
      rhythm_cell: 6 | 1 1 4
      why: a whole bar of one pitch is a bell, then a three step staircase back to the seventh of E7; the identity is the extreme duration contrast, one attack against three, which no other K candidate
        has
      cites: BAR-11 (a held voice against motion); CLS-03 (phrase ends on the dominant)
    - id: K6
      label: the semitone neighbour
      bars: 1
      chords:
      - Am
      notes:
      - - - E5
          - 2
        - - F5
          - 1
        - - E5
          - 3
      rhythm_cell: 2 1 3
      why: the call is a single upper neighbour and back, the smallest possible ornament; it reads as a clock tick rather than a tune, and a listener can hold three notes without effort
      cites: BAR-07 (mordent on an accent); MOT-07 (three pitches, one finger)
    - id: K7
      label: the offbeat summons
      bars: 2
      chords:
      - Am
      - Am
      notes:
      - - - r
          - 1
        - - E5
          - 1
        - - C5
          - 1
        - - D5
          - 1
        - - E5
          - 2
      - - - A4
          - 4
        - - r
          - 2
      rhythm_cell: r 1 1 1 2 | 4 r
      why: it enters off the beat, which is the one thing an accompanist cannot cover up; the pickup makes the downbeat of the next bar feel like an answer, and the phrase then stops early and leaves a
        hole
      cites: RCK-10 (approach from outside the beat); CLS-02 (antecedent leaves a question)
    - id: K8
      label: the two peaks
      bars: 2
      chords:
      - Am
      - C
      notes:
      - - - E5
          - 2
        - - D5
          - 1
        - - C5
          - 1
        - - D5
          - 2
      - - - E5
          - 2
        - - G5
          - 4
      rhythm_cell: 2 1 1 2 | 2 4
      why: a call then a louder reply a third higher, the second peak held; the repeated 2 1 1 2 opening makes the second bar feel earned, and the G5 is the brightest note K ever reaches
      cites: parent K; FOX-04 (one deliberate deviation in a narrow line); UEM-05 (rising close)
  Z:
    name: Zeus, the sunny rising arpeggio
    parent: 'three rising quarter notes through the chord: G4 C5 E5, one bar, C major'
    key: C major
    scale:
    - C
    - D
    - E
    - F
    - G
    - A
    - B
    chromatic_allowed: []
    register_band:
    - 64
    - 86
    parent_notes:
    - - G4
      - 2
    - - C5
      - 2
    - - E5
      - 2
    brief: 'open, upward, major, no shadow: a figure a child can sing, with a clear high point, over C and G7'
    candidates:
    - id: Z1
      label: the rising steps
      bars: 1
      chords:
      - C
      notes:
      - - - C5
          - 1
        - - D5
          - 1
        - - E5
          - 1
        - - F5
          - 1
        - - G5
          - 1
        - - r
          - 1
      rhythm_cell: 1 1 1 1 1 r
      why: a plain scale is the simplest upward shape and it passes through every degree, so it cannot be mistaken for the arpeggio Z it replaces; the final rest is what stops it sounding like an exercise
      cites: MOT-07 (stepwise, one octave); FOX-04 (a narrow line that grows)
    - id: Z2
      label: the leap and roll
      bars: 1
      chords:
      - C
      notes:
      - - - C5
          - 2
        - - G5
          - 3
        - - E5
          - 1
      rhythm_cell: 2 3 1
      why: 'the sunburst: a fifth up to the brightest note in the bar, held twice as long as the note it left, then a clipped third back down. It is the only Z that peaks on its second note and the only
        one that both rises and gets slower, so it is the most abrupt of the eight and the one that cannot be confused with the parent, whose three quarter notes are all the same length'
      cites: parent Z; UEM-05 (rising figure then settle)
    - id: Z3
      label: the triplet shine
      bars: 1
      chords:
      - C
      notes:
      - - - E5
          - 1
        - - G5
          - 1
        - - C6
          - 1
        - - r
          - 1
        - - G5
          - 1
        - - r
          - 1
      rhythm_cell: 1 1 1 r 1 r
      why: three fast notes up to the top of the chip's usable range then two isolated drops; the gaps are the shine, and C6 is the highest note any motif in the score reaches, so it marks the section by
        register alone
      cites: CHIP-01 (duty separation); MOT-05 (register as place signature)
    - id: Z4
      label: the bell arpeggio
      bars: 1
      chords:
      - C
      notes:
      - - - G4
          - 1
        - - C5
          - 1
        - - E5
          - 1
        - - G5
          - 1
        - - E5
          - 1
        - - C5
          - 1
      rhythm_cell: 1 1 1 1 1 1
      why: up four and down two through the same triad, which is the shape a hand makes on a bell; it repeats the parent's arpeggio identity at a faster rate and adds the descent, so it reads as the same
        sun going behind a cloud and coming back
      cites: parent Z; BAR-08 (arpeggiated chord); UEM-01 (up then down broken chord)
    - id: Z5
      label: the held sunrise
      bars: 2
      chords:
      - C
      - C
      notes:
      - - - C5
          - 4
        - - E5
          - 2
      - - - G5
          - 6
      rhythm_cell: 4 2 | 6
      why: two long rises then a whole bar sitting on the fifth; nothing moves in the second bar, so the listener has time to memorise the note and the phrase ends on it rather than leaving it
      cites: BAR-11 (held voice); CLS-02 (consequent closes)
    - id: Z6
      label: the two note motto
      bars: 1
      chords:
      - C
      notes:
      - - - G4
          - 2
        - - E5
          - 4
      rhythm_cell: 2 4
      why: two notes and one interval, a major sixth; the fewest possible events, which is the most a listener can be asked to remember, and the long second note keeps it from sounding clipped
      cites: MOT-07 (singable, one finger); FOX-05 (a fixed two note figure)
    - id: Z7
      label: the dotted climb
      bars: 2
      chords:
      - C
      - C
      notes:
      - - - C5
          - 3
        - - D5
          - 3
      - - - E5
          - 3
        - - G5
          - 3
      rhythm_cell: 3 3 | 3 3
      why: four dotted quarters lift two notes per bar; the second attack of every bar falls off the beat, so the waltz is pulled forward and the motif has a lilt no other Z candidate has, while the pitches
        still only rise
      cites: CLS-07 (dotted rhythms against the waltz); BAR-03 (sequence)
    - id: Z8
      label: the fanfare third
      bars: 1
      chords:
      - C
      notes:
      - - - C5
          - 2
        - - E5
          - 2
        - - G5
          - 1
        - - A5
          - 1
      rhythm_cell: 2 2 1 1
      why: the triad then one more step that is not in the chord, so the phrase ends leaning upward instead of closing; that unresolved end is what makes it a fanfare rather than a cadence
      cites: UEM-05 (rising close); MET-06 (end the cell on the tension tone)
  P:
    name: Poseidon, the tide
    parent: rising minor arpeggio E4 G4 B4, then crest and fall E5 D5 B4, E minor
    key: E minor
    scale:
    - E
    - F#
    - G
    - A
    - B
    - C
    - D
