        - - G4
          - 2
        - - B4
          - 2
      - - - E5
          - 3
        - - B4
          - 3
      rhythm_cell: 2 2 2 | 3 3
      why: the parent's rise kept exactly and its fall made symmetrical, so the second bar is the first bar's mirror at twice the note length; the tide is heard as one wave with a crest, not as a run
      cites: parent P; BAR-11 (slow voice against motion)
    - id: P2
      label: the undertow
      bars: 2
      chords:
      - Em
      - Em
      notes:
      - - - B4
          - 3
        - - A4
          - 3
      - - - G4
          - 3
        - - E4
          - 3
      rhythm_cell: 3 3 | 3 3
      why: 'the same water going out: two-note groups falling by thirds in dotted quarters, so it is the parent read backwards and slowed; the descent is the identity and the listener hears the ebb even
        without the rise'
      cites: BAR-03 (sequence down); MOT-05 (same place, opposite mood)
    - id: P3
      label: the double wave
      bars: 1
      chords:
      - Em
      notes:
      - - - E4
          - 1
        - - G4
          - 1
        - - B4
          - 1
        - - E5
          - 1
        - - B4
          - 1
        - - G4
          - 1
      rhythm_cell: 1 1 1 1 1 1
      why: 'one bar equals one wave: up the triad and straight back down, so the motif is a unit that can repeat as an ostinato without ever needing variation; the symmetry is the hook'
      cites: BAR-05 (ground figure); UEM-01 (up then down arpeggio)
    - id: P4
      label: the crest
      bars: 2
      chords:
      - Em
      - Em
      notes:
      - - - E4
          - 2
        - - B4
          - 4
      - - - E5
          - 6
      rhythm_cell: 2 4 | 6
      why: 'two attacks then one held peak: the leap of a fifth is the swell and the whole second bar is the crest hanging; with three attacks in the motif there is nothing to misremember'
      cites: BAR-11 (held voice); CLS-02 (the consequent ends on the peak)
    - id: P5
      label: the deep swell
