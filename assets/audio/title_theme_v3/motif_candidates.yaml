        - - D5
          - 1
        - - C#5
          - 2
        - - A4
          - 2
      rhythm_cell: 1 1 2 2
      why: 'the first note is struck twice before it slides: a hammer on metal, then the semitone, then the drop; the doubled attack is the whole difference from the parent and it reads as a mechanism'
      cites: CHIP-03 (mechanical hit); BAR-07
    - id: H7
