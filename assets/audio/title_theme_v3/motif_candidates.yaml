    - - G4
      - 2
    - - B4
      - 2
    - - E5
      - 3
    - - D5
      - 1
    - - B4
      - 2
    brief: 'water: motion in one direction, a crest, a fall, low register, and enough length that the ear hears a swell rather than a jingle'
    candidates:
