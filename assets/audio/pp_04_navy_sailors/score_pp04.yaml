# PP-04 "Navy Sailors": the first fight cue. Card MUS-CUE-PP04, musician lane, 2026-10-22.
# Everything here is original. No melody, riff or bass line of any published game is quoted.
# The technique is taken from knowledge/MUSIC-STYLE-BIBLE.md, knowledge/music-styles/capcom.md
# (section 4.2 the first two bars, 4.3 the stage hook, 5 the drums) and knowledge/MUSIC-DRUMS.md.
#
# 4/4, D minor with a Dorian Bb over the VII chord, 176 bpm, 32 bars = 43.636 s.
# Bar = 4 * 60 / 176 = 1.363636 s, so the two bar hook cell ends at 2.727 s and the four bar
# phrase ends at 5.455 s. The hook is complete inside the first four seconds.
# Durations are in eighth notes; a 4/4 bar holds 8. Note names are concert pitch (A4 = 440 Hz).
