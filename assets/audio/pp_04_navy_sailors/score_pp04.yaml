  bpm: 176
  bars: 32
  loop_start_bar: 1
  loop_end_bar: 28
  tail_bars: 29 to 32
  form: "A 8 (the hook) + B 8 (the release, where the dodge phase sits) + A2 8 (the hook again, changed third return) + A3 8 (the hook once more, then the resolve in bars 29 to 32); bars 1 to 28 loop, bars 29 to 32 are the tail that plays when the fight ends"
  duration_seconds: 43.636
  fight_length: "the fight runs 45 to 60 s, so the loop plays 1.2 to 1.6 times and the tail resolves it"

motifs:
  N: "The sailor's shout, two bars: a neighbour turn A Bb A, then a fifth leap to the phrase peak D and a step back; the answer in bar 2 walks up G A Bb C D and settles on C. Six notes per bar, rhythm 1 1 2 1 2 1, the same rhythm in both bars. One leap per motif, the rest steps, which is what the hook grammar asks for."
  N_lift: "The tail lift: the same cell in quarters, walked up the triad A D F A and landed on the tonic D."

