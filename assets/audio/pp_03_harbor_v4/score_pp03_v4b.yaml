# PP-03 "Harbor" v4: the arrival cue, fourth pass. Card AUTO-MUSIC-NEXT (t_9861be83), musician lane,
# 2026-10-25. Everything here is original.
#
# Why v4 exists: PP-03 v3 is 100 of 100 on tools/hook_score.py (the best hook in the registry) and 29
# of 60 on the ear ledger, which is the floor of the ear among the newest builds (ear reviews
# pp_03_harbor_v3_20261024T071744Z.md 32 and pp_03_harbor_v3_20261024T071837Z.md 29, same judge; the
# 3 point gap is the ear's own noise floor). The ear's low axes on this cue are drums 4, human 3 and
# tension 5, so v4 leaves the melody and the cell exactly as v3 wrote them (the hook score must not
# move) and spends itself on arrangement, which is what assets/audio/EAR_SWEEP_2026-10-22.md names as
# the headroom:
#   - the drums now change their home rung in 4 bar groups as well as by bar, so the 4 bar and the
#     8 bar phrase each have their own arc (the card asks for variation every 4 and 8 bars);
#   - the close section loses the broken chord for two bars and builds a roll into the seam, so the
#     32 bar form ends with a 4 bar gesture instead of a straight run to the loop point;
#   - the light section carries a second prepared dissonance on bar 7, still inside the 1 to 2 per
#     8 bars that knowledge/MUSIC-DISSONANCE.md section 4 allows, prepared and resolved, never on
#     the first or last note of an H statement (F1), never in a cadence bar (F2), four bars after
#     the first device (F4);
#   - the lead's humanize block widens (velocity table, 3 tick micro shift, 4 tick gate).
#
# Leitmotif H stays the cue's material, unchanged from v3: the rise A4 C5 D5 E5 in bar one of every
# statement and the fall onto the tonic A. K, Z and P are the title and drive cues' statements
# (tools/drive_v2.py PLAN and LITERAL) and are not this cue's; inserting one here would change the
# cue's identity, so it stays a Q for gamedev rather than a silent edit.
#
# Dissonance, one device per 8 bar section in v3, two in the light section in v4:
#   - section bar 5 of every section: the inner voice takes the ninth of the chord on the downbeat
#     and resolves by step onto the third inside the same half bar (DIS-03 form, risk 2);
#   - light section bar 7: the same device again, four bars after the first, so the light section
#     sits at the top of the budget the knowledge file allows rather than in the middle of it;
#   - light section bar 22: the lead takes D#5 as a chromatic lower neighbour of E5 for one eighth
#     on a weak beat and returns to E5 (DIS-02, risk 1).
#
# A minor, 4/4, 68 bpm, 32 bars = 112.941 s. Durations are eighth notes; a 4/4 bar holds 8.
# Note names are concert pitch (A4 = 440 Hz).

