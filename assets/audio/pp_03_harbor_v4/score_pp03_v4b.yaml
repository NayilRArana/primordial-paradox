  brief: "low intensity under text; loop without a seam; v3 is 100 on the hook meter and 29 to 32 on the ear, whose low axes are drums 4, human 3 and tension 5; v4 leaves the melody alone and moves the drums, the close's 4 bar gesture and the light section's second dissonance"

motifs:
