[pytest]
# Card TEST-CLASSIFY-33 (2026-10-23). The suite runs on two hosts: this Windows PC (the nightly) and
# the Pine Linux computers (tools/pine_offload.py). A test that can only pass on one of them is not a
# regression, but it must say so instead of failing, so the offloaded run separates it. Three markers,
# one per reason, and tests/conftest.py turns each into a skip with the reason printed. The table of
# 33 in knowledge/TEST-CLASSIFY-2026-10-23.md gives the verdict and the evidence for every row.
markers =
    windows_only: the test, or a tool it loads, binds a Win32 API through ctypes.windll, so only a Windows host can run it
    host_png_bytes: the test compares a PNG this host writes with the committed copy byte for byte, so only the host that wrote the committed file passes it
    needs_git_checkout: the check shells out to git, so it needs a real checkout and not a zip of the tree
